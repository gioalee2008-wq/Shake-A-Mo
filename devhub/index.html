<style>
/* Layout: sticky studded header band with view tabs; one centered working column (max 1120px) below. */
:root {
  --bg: #f2f4ec;
  --surface: #ffffff;
  --surface-2: #e9eee1;
  --ink: #1d281e;
  --muted: #5b685b;
  --line: #d6ddcd;
  --accent: #2c8a4b;
  --accent-ink: #ffffff;
  --idea: #d63d74;
  --done: #2c8a4b;
  --doing: #c98a0c;
  --todo: #6c7a8a;
  --blocked: #c8402f;
  --stud: rgba(255, 255, 255, 0.16);
  --band: #2c6b3c;
  --band-ink: #f4fbef;
  --font-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111711; --surface: #192119; --surface-2: #212b21; --ink: #e7eee3; --muted: #9caa97;
    --line: #2d3a2d; --accent: #5cc47c; --accent-ink: #0d1a10; --idea: #ff6d9e; --done: #5cc47c;
    --doing: #f0b43c; --todo: #93a3b5; --blocked: #ff7a66; --stud: rgba(255, 255, 255, 0.07);
    --band: #1b3a23; --band-ink: #e7f5e2; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111711; --surface: #192119; --surface-2: #212b21; --ink: #e7eee3; --muted: #9caa97;
  --line: #2d3a2d; --accent: #5cc47c; --accent-ink: #0d1a10; --idea: #ff6d9e; --done: #5cc47c;
  --doing: #f0b43c; --todo: #93a3b5; --blocked: #ff7a66; --stud: rgba(255, 255, 255, 0.07);
  --band: #1b3a23; --band-ink: #e7f5e2; color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; letter-spacing: 0.01em; text-wrap: balance; margin: 0; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* Header band */
.band {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background-color: var(--band); color: var(--band-ink);
  background-image: radial-gradient(circle at 8px 8px, var(--stud) 3.5px, transparent 4px);
  background-size: 16px 16px;
}
.band-inner { max-width: 1120px; margin: 0 auto; padding-block: 12px 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-size: 26px; line-height: 1.1; }
.brand .sub { font-size: 13px; opacity: 0.85; }
.sync { margin-left: auto; font-size: 12px; opacity: 0.85; }
.tabs-scroll { overflow-x: auto; margin-top: 10px; scrollbar-width: none; }
.tabs { display: flex; gap: 4px; min-width: max-content; }
.tab { border: 0; background: transparent; color: var(--band-ink); padding: 8px 14px; border-radius: 8px 8px 0 0;
  font-weight: 600; cursor: pointer; opacity: 0.8; }
.tab:hover { opacity: 1; }
.tab[aria-selected="true"] { background: var(--bg); color: var(--ink); opacity: 1; }

main { max-width: 1120px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.view { display: grid; gap: 20px; }
.notice { padding: 10px 14px; border-radius: var(--radius); background: var(--surface-2); color: var(--muted); font-size: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; }
.panel h2 { font-size: 20px; margin-bottom: 10px; }
.panel h3 { font-size: 17px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }

/* Overview */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.stat .big { font-family: var(--font-display); font-size: 34px; line-height: 1; }
.bar { height: 10px; border-radius: 6px; background: var(--surface-2); overflow: hidden; display: flex; }
.bar > i { display: block; height: 100%; }
.bar .d { background: var(--done); }
.bar .g { background: var(--doing); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 760px) { .two { grid-template-columns: 1fr; } }
.phase-row { display: grid; grid-template-columns: 120px 1fr 64px; align-items: center; gap: 10px; padding: 6px 0; }
.areas { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.area-card { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px;
  cursor: pointer; display: grid; gap: 8px; }
.area-card:hover { border-color: var(--accent); }
.area-card .row { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }

/* Task rows */
.list { display: grid; gap: 6px; }
.group-title { display: flex; align-items: baseline; gap: 10px; margin-top: 6px; }
.group-title h3 { font-size: 18px; }
.task { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px;
  display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: start; }
.task.is-done .title { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.status { border: 0; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; cursor: pointer; min-width: 64px;
  color: var(--surface); text-transform: uppercase; letter-spacing: 0.05em; }
.status[disabled] { cursor: default; }
.s-done { background: var(--done); }
.s-doing { background: var(--doing); }
.s-todo { background: var(--todo); }
.s-blocked { background: var(--blocked); }
.title-btn { all: unset; cursor: pointer; font-weight: 600; display: block; }
.title-btn:focus-visible { outline: 2px solid var(--accent); }
.chips { grid-column: 2; display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.p1 { color: var(--blocked); font-weight: 700; }
.chip.idea { color: var(--idea); font-weight: 700; }
.chip.sig { font-family: var(--font-mono); }
.detail { grid-column: 1 / -1; display: grid; gap: 10px; border-top: 1px dashed var(--line); padding-top: 10px; margin-top: 6px; }
.detail p { margin: 0; max-width: 70ch; }
.detail textarea { width: 100%; min-height: 70px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--bg); resize: vertical; }
.row-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--blocked); }
.btn.danger.armed { background: var(--blocked); color: var(--surface); border-color: var(--blocked); }

/* Filters */
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filters input[type="search"] { flex: 1 1 220px; min-width: 0; }
.field { border: 1px solid var(--line); background: var(--surface); padding: 7px 10px; border-radius: 8px; }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; }
.count { font-size: 13px; color: var(--muted); }

/* Add form */
.add-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.add-grid label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 600; }
.add-grid .wide { grid-column: 1 / -1; }
.sig-picks { display: flex; gap: 6px; flex-wrap: wrap; }
.sig-picks label { display: inline-flex; gap: 4px; align-items: center; color: var(--ink); font-weight: 500; }

/* Content matrix */
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 640px; }
th, td { border-bottom: 1px solid var(--line); padding: 10px 8px; text-align: left; vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; }
.cell { all: unset; cursor: pointer; display: grid; gap: 4px; padding: 6px 8px; border-radius: 8px; width: 100%; box-sizing: border-box; }
.cell:hover { background: var(--surface-2); }
.cell .name { font-size: 13px; }
.pill { justify-self: start; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; color: var(--surface); text-transform: uppercase; letter-spacing: 0.05em; }
.zone-name { font-weight: 700; white-space: nowrap; }

/* Signals */
.sig-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
@media (max-width: 420px) { .sig-grid { grid-template-columns: 1fr; } }
.sig-card { display: grid; gap: 8px; align-content: start; }
.sig-head { display: flex; gap: 10px; align-items: center; }
.sig-num { font-family: var(--font-display); font-size: 22px; width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center;
  background: var(--band); color: var(--band-ink); flex: none; }
.badge { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; }
.badge.top { color: var(--blocked); }
.badge.imp { color: var(--muted); }
.mini { display: grid; gap: 3px; margin: 0; padding: 0; list-style: none; font-size: 13px; }
.mini li { display: flex; gap: 8px; align-items: baseline; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; transform: translateY(-1px); }
.d-done { background: var(--done); } .d-doing { background: var(--doing); } .d-todo { background: var(--todo); } .d-blocked { background: var(--blocked); }
.rules { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
@media (prefers-reduced-motion: no-preference) { .bar > i { transition: width 0.4s ease; } }

/* Launcher */
.launch-btn { border: 1px solid var(--accent); color: var(--accent); background: transparent; padding: 3px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 700; cursor: pointer; justify-self: start; }
.launch-btn:hover { background: var(--accent); color: var(--accent-ink); }
.launcher { grid-column: 1 / -1; display: grid; gap: 14px; background: var(--surface-2); border-radius: var(--radius); padding: 14px; margin-top: 6px; min-width: 0; }
.launcher h4 { font-family: var(--font-display); font-weight: 400; font-size: 17px; margin: 0; }
.mode-row { display: flex; gap: 8px; flex-wrap: wrap; }
.q { display: grid; gap: 6px; }
.q-title { font-weight: 700; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 6px; }
.opt { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; align-items: start; background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 10px; cursor: pointer; }
.opt:has(input:checked) { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.opt input { margin-top: 4px; }
.opt .lbl { font-weight: 600; }
.opt .why { grid-column: 2; font-size: 12.5px; color: var(--muted); }
.rec { font-size: 11px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.05em; margin-left: 4px; }
.launcher textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--surface); resize: vertical; }
.launcher textarea.prompt { min-height: 220px; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.45; }
.thinking { font-size: 14px; color: var(--muted); }
.launch-log { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 13px; }
.launch-log a { color: var(--accent); font-weight: 600; }
.result-ok { color: var(--done); font-weight: 600; }
.result-bad { color: var(--blocked); font-weight: 600; }
</style>

<header class="band">

</header>

<main id="main">

  const filters = Object.assign({ q: "", area: "", phase: "", signal: "", status: "open", ideas: false, group: "area" }, loadPrefs());
  function loadPrefs() { try { return JSON.parse(localStorage.getItem(prefsKey) || "{}"); } catch { return {}; } }
  function savePrefs() { try { localStorage.setItem(prefsKey, JSON.stringify(filters)); } catch { /* storage unavailable */ } }

  const $ = (s, r = document) => r.querySelector(s);
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v === false || v == null) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    return n;
  };

  // ---------- Data helpers ----------
  const all = () => [...tasks.entries()].map(([id, d]) => ({ id, ...d }));
  const rank = (t) => [PHASES.indexOf(t.phase), PRIOS.indexOf(t.priority), t.status === "doing" ? 0 : 1, t.order ?? 9999];
  const byRank = (a, b) => { const x = rank(a), y = rank(b); for (let i = 0; i < x.length; i++) if (x[i] !== y[i]) return x[i] - y[i]; return 0; };
  const stats = (list) => {
    const s = { total: list.length, done: 0, doing: 0, blocked: 0 };
    for (const t of list) { if (t.status === "done") s.done++; else if (t.status === "doing") s.doing++; else if (t.status === "blocked") s.blocked++; }
    s.pct = s.total ? Math.round((s.done / s.total) * 100) : 0;
    return s;
  };
  const bar = (s) => el("div", { class: "bar", role: "img", "aria-label": `${s.done} of ${s.total} done` },
    el("i", { class: "d", style: `width:${s.total ? (s.done / s.total) * 100 : 0}%` }),
    el("i", { class: "g", style: `width:${s.total ? (s.doing / s.total) * 100 : 0}%` }));

  function queueWrite(id, fn) {
    const prev = writeChains.get(id) || Promise.resolve();
    const next = prev.then(fn).catch((e) => {
      if (e && e.code === "invalid_argument") { canWrite = false; setSync("View only: changes can't be saved for your access level."); scheduleRender(); }
      else setSync("Couldn't save the last change. Try again in a moment.");
    });
    writeChains.set(id, next);
    return next;
  }
  function updateTask(id, patch) {
    if (!col || !canWrite) return;
    const cur = tasks.get(id); if (!cur) return;
    tasks.set(id, { ...cur, ...patch });  // optimistic
    scheduleRender();
    queueWrite(id, () => col.doc(id).update(patch));
  }
  function cycleStatus(id) {
    const cur = tasks.get(id); if (!cur) return;
    const order = ["todo", "doing", "done"];
    const i = order.indexOf(cur.status);
    updateTask(id, { status: order[(i + 1) % order.length] });
  }

  // ---------- Rendering ----------
  function setSync(text) { $("#sync").textContent = text; }
  function scheduleRender() {
    if (renderQueued) return;
    renderQueued = true;
    requestAnimationFrame(() => { renderQueued = false; render(); });
  }
  function typing() {
    const a = document.activeElement;
    return a && (a.tagName === "TEXTAREA" || (a.tagName === "INPUT" && a.type !== "checkbox")) && a.closest("#main");
  }

  function render() {
    if (typing()) { renderDeferred = true; return; }
    renderDeferred = false;
    for (const b of document.querySelectorAll(".tab")) b.setAttribute("aria-selected", String(b.dataset.view === view));
    const main = $("#main");
    const y = window.scrollY;
    main.replaceChildren(views[view]());
    window.scrollTo(0, y);
  }
  document.addEventListener("focusout", () => { if (renderDeferred) setTimeout(() => { if (!typing()) render(); }, 0); });

  function emptyState() {
    if (!db) return el("div", { class: "notice" }, "The task database isn't available in this view (for example when signed out). Open the page on claude.ai while signed in to see and tick off tasks.");
    if (!loaded) return el("div", { class: "notice" }, "Loading your tasks…");
    return el("div", { class: "notice" }, "No tasks yet. Add your first one from the Tasks tab.");
  }

  function statusButton(t) {
    return el("button", {
      class: `status s-${t.status}`, disabled: !canWrite,
      title: canWrite ? "Click to change status" : STATUS_LABEL[t.status],
      "aria-label": `Status: ${STATUS_LABEL[t.status]}. Click to change.`,
      onclick: (e) => { e.stopPropagation(); cycleStatus(t.id); },
    }, STATUS_LABEL[t.status]);
  }
  function chips(t, opts = {}) {
    return el("div", { class: "chips" },
      t.idea ? el("span", { class: "chip idea" }, "★ New idea") : null,
      el("span", { class: `chip ${t.priority === "P1" ? "p1" : ""}` }, t.priority),
      opts.hidePhase ? null : el("span", { class: "chip" }, t.phase),
      opts.hideArea ? null : el("span", { class: "chip" }, t.area),
      (t.signals || []).length === 8 ? el("span", { class: "chip sig" }, "All signals")
        : (t.signals || []).map((n) => el("span", { class: "chip sig", title: SIGNALS[n - 1]?.name }, `S${n}`)));
  }

  function taskRow(t, opts = {}) {
    const open = expanded.has(t.id);
    const toggle = () => { if (open) { expanded.delete(t.id); launcherOpen.delete(t.id); } else expanded.add(t.id); render(); };
    const openLauncher = () => {
      if (launcherOpen.has(t.id)) launcherOpen.delete(t.id); else { launcherOpen.add(t.id); expanded.add(t.id); }
      render();
    };
    const chipRow = chips(t, opts);
    if (t.status !== "done") chipRow.append(el("button", { class: "launch-btn", "aria-expanded": String(launcherOpen.has(t.id)), onclick: openLauncher },
      launcherOpen.has(t.id) ? "Hide launcher" : "Do it with Claude"));
    const row = el("div", { class: `task${t.status === "done" ? " is-done" : ""}` },
      statusButton(t),
      el("button", { class: "title-btn title", "aria-expanded": String(open), onclick: toggle }, t.title),
      chipRow);
    if (open) {
      const notesId = `notes-${t.id}`;
      const notes = el("textarea", { id: notesId, placeholder: "Your notes (saved when you click away)", disabled: !canWrite });
      notes.value = t.notes || "";
      notes.addEventListener("change", () => updateTask(t.id, { notes: notes.value }));
      const statusSel = el("select", { class: "field", "aria-label": "Status", disabled: !canWrite,
        onchange: (e) => updateTask(t.id, { status: e.target.value }) },
        STATUSES.map((s) => el("option", { value: s, selected: s === t.status }, STATUS_LABEL[s])));
      const phaseSel = el("select", { class: "field", "aria-label": "Phase", disabled: !canWrite,
        onchange: (e) => updateTask(t.id, { phase: e.target.value }) },
        PHASES.map((p) => el("option", { value: p, selected: p === t.phase }, p)));
      const prioSel = el("select", { class: "field", "aria-label": "Priority", disabled: !canWrite,
        onchange: (e) => updateTask(t.id, { priority: e.target.value }) },
        PRIOS.map((p) => el("option", { value: p, selected: p === t.priority }, p)));
      const del = el("button", { class: "btn danger", disabled: !canWrite }, "Delete task");
      del.addEventListener("click", () => {
        if (!del.classList.contains("armed")) { del.classList.add("armed"); del.textContent = "Click again to delete"; return; }
        tasks.delete(t.id); expanded.delete(t.id); scheduleRender();
        queueWrite(t.id, () => col.doc(t.id).delete());
      });
      row.append(el("div", { class: "detail" },
        t.detail ? el("p", {}, t.detail) : null,
        (t.signals || []).length ? el("p", { class: "small muted" },
          "Discovery signals: " + t.signals.map((n) => `${n} ${SIGNALS[n - 1]?.short}`).join(" · ")) : null,
        notes,
        launchLog(t),
        el("div", { class: "row-actions" }, statusSel, phaseSel, prioSel, del)));
      if (launcherOpen.has(t.id)) row.append(launcherPanel(t));
    }
    return row;
  }

  // Launcher ---------------------------------------------------------------
  const modelName = (id) => MODELS.find((m) => m.id === id)?.name || id;
  const safeKey = (s, i) => (String(s || "").replace(/[^A-Za-z0-9_]/g, "_").slice(0, 40) || `q${i + 1}`);
  function defaultModel(t) {
    if (t.plan?.suggestedModel) return t.plan.suggestedModel;
    return STRONG_AREAS.includes(t.area) || t.priority === "P1" ? "claude-opus-5-5" : "claude-sonnet-5-5";
  }
  function draftFor(t) {
    let d = drafts.get(t.id);
    if (!d) {
      const saved = t.launchPrefs || {};
      d = { mode: "", answers: { ...(saved.answers || {}) }, extra: saved.extra || "", model: saved.model || defaultModel(t),
        effort: saved.effort || "", target: saved.target || (canCloud ? "cloud" : "copy"), prompt: "", promptTouched: false };
      for (const q of t.plan?.questions || []) if (d.answers[q.id] == null) d.answers[q.id] = q.recommended;
      drafts.set(t.id, d);
    }
    if (d.target === "cloud" && !canCloud) d.target = "copy";
    return d;
  }

  function buildPrompt(t, d) {
    const lines = [
      `I'm working on my Roblox game "SHAKE A Monster Tree!". Please do this task from my Dev Hub.`, "",
      `TASK: ${t.title}`, `System: ${t.area} · Phase: ${t.phase} · Priority: ${t.priority}`,
    ];
    if (t.detail) lines.push(`Details: ${t.detail}`);
    const sig = (t.signals || []).map((n) => SIGNALS[n - 1]).filter(Boolean);
    if (sig.length) lines.push(`Roblox discovery signals this should improve: ${sig.map((g) => `${g.n} ${g.name}`).join("; ")}.`);
    const qs = d.mode === "plan" ? t.plan?.questions || [] : [];
    const picks = qs.map((q) => { const o = q.options[d.answers[q.id]]; return o ? `- ${q.question} → ${o.label}${o.detail ? ` (${o.detail})` : ""}` : null; }).filter(Boolean);
    if (picks.length) lines.push("", "MY DECISIONS:", ...picks);
    if (d.extra && d.extra.trim()) lines.push("", "EXTRA INSTRUCTIONS FROM ME:", d.extra.trim());
    if (t.notes && t.notes.trim()) lines.push("", "MY NOTES ON THIS TASK:", t.notes.trim());
    lines.push("", "GAME CONTEXT:", GAME_CONTEXT, "", "HOW I WORK:", WORK_RULES, "",
      "WHERE THE PROJECT IS: the Roblox place and its scripts are on my Windows PC (folder \"Shake a Monster Tree!\", opened in Roblox Studio with the Studio MCP). " +
      `If you can't reach them from where you're running, tell me, and put any code or docs in the GitHub repo ${REPO_URL} instead.`,
      "", `BEFORE YOU START: if you can reach the GitHub repo, read docs/KNOWLEDGE.md (what we know about Roblox discovery in 2026) and docs/ROBLOX_ALGORITHM_PLAYBOOK.md.`,
      "", "WHEN YOU'RE DONE: tell me what changed, what you tested (PASS / FAIL / NOT TESTED), and what I should Play-test.");
    return lines.join("\n");
  }

  function savePlan(id, plan) {
    const cur = tasks.get(id); if (!cur) return;
    if (canWrite && col) updateTask(id, { plan }); else { tasks.set(id, { ...cur, plan }); scheduleRender(); }
  }

  async function planTask(t) {
    if (!sample || planning.get(t.id)?.ctl) return;
    const ctl = new AbortController();
    planning.set(t.id, { ctl, error: "" });
    scheduleRender();
    const prompt = [
      "You help plan tasks for a Roblox game. Game context:", GAME_CONTEXT, "",
      `Task: ${t.title}`, `System: ${t.area}. Phase: ${t.phase}. Priority: ${t.priority}.`,
      t.detail ? `Details: ${t.detail}` : "", t.notes ? `Owner's notes: ${t.notes}` : "", "",
      "Before this task goes to a coding agent, the game's owner wants to make the key decisions. List the 3 to 5 decisions that most change the result " +
      "(design choices, numbers, scope, look and feel). For each, give 2 to 4 concrete options and mark the one you recommend. Use short, plain words for a young developer.",
      "Also suggest which Claude model fits: \"claude-opus-5-5\" for art, rigging, multi-step systems or hard bugs; \"claude-sonnet-5-5\" for scripts, UI and tuning; \"claude-haiku-5-5\" for small edits and docs.",
      "",
      'Reply with only JSON in this shape: {"summary": "one sentence on how you would approach it", "questions": [{"id": "q1", "question": "...", ' +
      '"options": [{"label": "short option", "detail": "one short line on the effect"}], "recommended": 0}], "suggestedModel": "claude-opus-5-5", "modelReason": "one short line"}',
    ].filter((x) => x !== "").join("\n");
    try {
      const res = await sample.json(prompt, { signal: ctl.signal, cache: false });
      const questions = (Array.isArray(res?.questions) ? res.questions : []).slice(0, 6).map((q, i) => {
        const options = (Array.isArray(q?.options) ? q.options : []).slice(0, 5)
          .map((o) => ({ label: String(o?.label ?? o ?? "").slice(0, 160), detail: String(o?.detail ?? "").slice(0, 240) })).filter((o) => o.label);
        const r = Number(q?.recommended);
        return { id: safeKey(q?.id, i), question: String(q?.question ?? "").slice(0, 300), options,
          recommended: Number.isInteger(r) && r >= 0 && r < options.length ? r : 0 };
      }).filter((q) => q.question && q.options.length);
      if (!questions.length) throw { code: "invalid_json" };
      const plan = { summary: String(res.summary ?? "").slice(0, 400), questions,
        suggestedModel: MODELS.some((m) => m.id === res.suggestedModel) ? res.suggestedModel : defaultModel(t),
        modelReason: String(res.modelReason ?? "").slice(0, 240), at: new Date().toISOString() };
      planning.delete(t.id);
      const d = draftFor(t);
      d.mode = "plan"; d.answers = {}; d.promptTouched = false; d.model = plan.suggestedModel;
      for (const q of questions) d.answers[q.id] = q.recommended;
      savePlan(t.id, plan);
    } catch (e) {
      const copy = {
        cancelled: "",
        not_granted: "This page isn't allowed to use Claude for you. You can still launch without planning.",
        sampling_disabled: "Claude isn't available on this account here. You can still launch without planning.",
        rate_limited: "Too many requests right now. Try again in a minute.",
        session_expired: "Sign in to claude.ai again, then try.",
        invalid_json: "Claude's answer didn't come back in a usable shape. Try again.",
        refused: "Claude declined to plan this one. Edit the task text and try again.",
      };
      planning.set(t.id, { ctl: null, error: copy[e?.code] ?? "Planning didn't finish. Try again." });
      scheduleRender();
    }
  }

  function launchError(e) {
    switch (e?.code) {
      case "server_not_connected": return "The Claude Code Remote connector isn't connected. Add it in claude.ai Settings → Connectors, or choose Copy prompt.";
      case "needs_reauth": return "Reconnect Claude Code Remote in claude.ai Settings → Connectors, then try again.";
      case "not_in_manifest": case "approval_required": case "consent_required":
        return "Starting sessions needs your OK. Click Launch again and allow it when claude.ai asks, or choose Copy prompt.";
      case "blocked_by_policy": return "Your organization doesn't allow starting sessions from pages. Choose Copy prompt instead.";
      case "selection_required": return "Pick which Claude Code Remote connector to use when claude.ai asks, then try again.";
      case "tool_error": return `Claude Code couldn't start the session: ${String(e.message || "").slice(0, 200)}`;
      case "server_unavailable": case "upstream_error":
        return "No answer from Claude Code. The session may still have started: check claude.ai/code before launching again.";
      default: return "The launch didn't go through. Try again, or choose Copy prompt.";
    }
  }

  function recordLaunch(id, entry, d) {
    const latest = tasks.get(id); if (!latest) return;
    const patch = { launches: [...(latest.launches || []), entry].slice(-10) };
    if (latest.status === "todo") patch.status = "doing";
    if (d) patch.launchPrefs = { answers: { ...d.answers }, extra: d.extra, model: d.model, effort: d.effort, target: d.target };
    if (canWrite && col) updateTask(id, patch); else { tasks.set(id, { ...latest, ...patch }); scheduleRender(); }
  }

  // Called straight from a click, so the clipboard write happens inside the gesture.
  function launchTask(id, quick) {
    const t = { id, ...(tasks.get(id) || {}) };
    if (!t.title || launching.get(id)?.busy) return;
    const d = draftFor(t);
    const model = quick ? defaultModel(t) : d.model;
    const effort = quick ? "" : d.effort;
    const target = quick ? (canCloud ? "cloud" : "copy") : d.target;
    const prompt = quick ? buildPrompt(t, { mode: "quick", answers: {}, extra: "" }) : (d.promptTouched ? d.prompt : buildPrompt(t, d));
    const st = { busy: true, result: null };
    launching.set(id, st);
    const entry = { at: new Date().toISOString(), model, target, mode: quick ? "quick" : "planned" };
    const finish = (result, record) => { st.busy = false; st.result = result; if (record) recordLaunch(id, entry, quick ? null : d); scheduleRender(); };

    if (target === "copy") {
      let p;
      try { p = navigator.clipboard.writeText(prompt); } catch { p = Promise.reject(new Error("no clipboard")); }
      p.then(() => finish({ ok: true, text: "Prompt copied. Paste it into Claude Code on your PC." }, true),
        () => finish({ ok: false, text: "Couldn't copy automatically. Select the prompt below and copy it.", prompt }, false));
      scheduleRender();
      return;
    }
    const input = { prompt, title: `Dev Hub: ${t.title}`.slice(0, 120), model, source_url: REPO_URL, tags: ["devhub"] };
    if (effort) input.effort = effort;
    scheduleRender();
    mcp.callTool(CCR, "create_session", input).then((res) => {
      const raw = JSON.stringify(res?.payload ?? res?.content ?? "");
      const sid = (raw.match(/session_[A-Za-z0-9]+/) || [])[0] || "";
      if (sid) entry.sessionId = sid;
      finish({ ok: true, text: `Session started with ${modelName(model)}.`, url: sid ? `https://claude.ai/code/${sid}` : "https://claude.ai/code" }, true);
    }, (e) => finish({ ok: false, text: launchError(e), prompt }, false));
  }

  function radioCards(name, items, selected, onPick, extra = {}) {
    return el("div", { class: "opts" }, items.map((it, i) => {
      const id = `${name}-${i}`;
      const input = el("input", { type: "radio", name, id, checked: selected === it.id, disabled: !!it.disabled, onchange: () => onPick(it.id) });
      return el("label", { class: "opt", for: id, style: it.disabled ? "opacity:0.55;cursor:not-allowed" : null }, input,
        el("span", { class: "lbl" }, it.name, extra.mark === it.id ? el("span", { class: "rec" }, extra.markText || "Suggested") : null),
        it.why ? el("span", { class: "why" }, it.why) : null);
    }));
  }

  function planForm(t, d) {
    const plan = t.plan;
    const promptId = `prompt-${t.id}`;
    const refreshPrompt = () => {
      if (d.promptTouched) return;
      d.prompt = buildPrompt(t, d);
      const ta = document.getElementById(promptId); if (ta) ta.value = d.prompt;
    };
    const wrap = el("div", { class: "view", style: "gap:14px" });
    if (plan.summary) wrap.append(el("p", { class: "small", style: "margin:0" }, el("strong", {}, "Claude's approach: "), plan.summary));
    wrap.append(...plan.questions.map((q) => el("fieldset", { class: "q", style: "border:0;padding:0;margin:0" },
      el("legend", { class: "q-title", style: "padding:0;margin-bottom:6px" }, q.question),
      radioCards(`q-${t.id}-${q.id}`, q.options.map((o, i) => ({ id: i, name: o.label, why: o.detail })), d.answers[q.id],
        (v) => { d.answers[q.id] = v; refreshPrompt(); }, { mark: q.recommended, markText: "Recommended" }))));

    wrap.append(el("fieldset", { class: "q", style: "border:0;padding:0;margin:0" },
      el("legend", { class: "q-title", style: "padding:0;margin-bottom:6px" }, "Which Claude model?"),
      plan.modelReason ? el("p", { class: "small muted", style: "margin:0 0 4px" }, `Suggested: ${modelName(plan.suggestedModel)}. ${plan.modelReason}`) : null,
      radioCards(`m-${t.id}`, MODELS, d.model, (v) => { d.model = v; }, { mark: plan.suggestedModel })));

    const effortSel = el("select", { class: "field", id: `effort-${t.id}`, "aria-label": "Effort", onchange: (e) => { d.effort = e.target.value; } },
      EFFORTS.map(([v, txt]) => el("option", { value: v, selected: d.effort === v }, txt)));
    wrap.append(el("label", { class: "check", for: `effort-${t.id}` }, "Thinking effort:", effortSel));

    wrap.append(el("fieldset", { class: "q", style: "border:0;padding:0;margin:0" },
      el("legend", { class: "q-title", style: "padding:0;margin-bottom:6px" }, "Where should it run?"),
      radioCards(`t-${t.id}`, TARGETS.map((x) => ({ ...x, disabled: x.id === "cloud" && !canCloud,
        why: x.id === "cloud" && !canCloud ? "Not available in this view (needs the Claude Code Remote connector on claude.ai)." : x.why })),
        d.target, (v) => { d.target = v; scheduleRender(); })));

    const extra = el("textarea", { id: `extra-${t.id}`, placeholder: "Anything else Claude should know or do? e.g. \"keep the leaves mint green\", \"don't touch the Forest trees\"" });
    extra.value = d.extra;
    extra.addEventListener("input", () => { d.extra = extra.value; refreshPrompt(); });
    wrap.append(el("label", { class: "q", for: `extra-${t.id}` }, el("span", { class: "q-title" }, "Your extra instructions"), extra));

    const promptTa = el("textarea", { id: promptId, class: "prompt", "aria-label": "Prompt that will be sent" });
    promptTa.value = d.promptTouched ? d.prompt : buildPrompt(t, d);
    promptTa.addEventListener("input", () => { d.prompt = promptTa.value; d.promptTouched = true; });
    const preview = el("details", {}, el("summary", { class: "small", style: "cursor:pointer;font-weight:600" }, "Preview or edit the full prompt"),
      el("div", { class: "view", style: "gap:8px;margin-top:8px" }, promptTa,
        el("button", { class: "btn", type: "button", onclick: () => { d.promptTouched = false; d.prompt = buildPrompt(t, d); promptTa.value = d.prompt; } }, "Reset to generated prompt")));
    wrap.append(preview);

    const busy = !!launching.get(t.id)?.busy;
    wrap.append(el("div", { class: "row-actions" },
      el("button", { class: "btn primary", disabled: busy, onclick: () => launchTask(t.id, false) },
        busy ? "Launching…" : d.target === "cloud" ? `Launch with ${modelName(d.model)}` : "Copy prompt"),
      el("button", { class: "btn", disabled: !sample, onclick: () => planTask(t) }, "Ask Claude for new options")));
    return wrap;
  }

  function launcherPanel(t) {
    const d = draftFor(t);
    const p = planning.get(t.id);
    const L = launching.get(t.id);
    const panel = el("div", { class: "launcher" }, el("h4", {}, "Do this task with Claude"));
    const planBtn = el("button", { class: "btn", disabled: (!sample && !t.plan) || !!p?.ctl,
      onclick: () => { d.mode = "plan"; if (t.plan) scheduleRender(); else planTask(t); } },
      t.plan ? "Plan it with me" : "Plan it with me (Claude suggests options)");
    const quickBtn = el("button", { class: "btn primary", disabled: !!L?.busy, onclick: () => launchTask(t.id, true) },
      canCloud ? "Launch now, skip planning" : "Copy prompt now, skip planning");
    panel.append(el("div", { class: "mode-row" }, planBtn, quickBtn),
      el("p", { class: "small muted", style: "margin:0" },
        `"Launch now" sends just the task and your notes, using ${modelName(defaultModel(t))}, ${canCloud ? "in a new cloud session" : "by copying the prompt"}.`));
    if (!sample && !t.plan) panel.append(el("p", { class: "small muted", style: "margin:0" }, "Planning needs Claude in this view; open the page on claude.ai. You can still launch."));
    if (p?.ctl) panel.append(el("div", { class: "row-actions" },
      el("span", { class: "thinking", role: "status" }, "Claude is working out the key decisions. This can take up to a minute."),
      el("button", { class: "btn", onclick: () => p.ctl.abort() }, "Stop")));
    if (p?.error) panel.append(el("p", { class: "result-bad small", style: "margin:0" }, p.error));
    if (d.mode === "plan" && t.plan && !p?.ctl) panel.append(planForm(t, d));
    if (L?.result) {
      const r = L.result;
      panel.append(el("div", { class: "view", style: "gap:8px", role: "status" },
        el("p", { class: `${r.ok ? "result-ok" : "result-bad"} small`, style: "margin:0" }, r.text, " ",
          r.url ? el("a", { href: r.url, target: "_blank", rel: "noopener" }, "Open it in Claude Code") : null),
        r.prompt ? (() => { const ta = el("textarea", { class: "prompt", readonly: true, "aria-label": "Prompt to copy" }); ta.value = r.prompt;
          ta.addEventListener("focus", () => ta.select()); return ta; })() : null));
    }
    return panel;
  }

  function launchLog(t) {
    const list = (t.launches || []).slice().reverse();
    if (!list.length) return null;
    return el("div", {}, el("div", { class: "eyebrow" }, "Launched"),
      el("ul", { class: "launch-log" }, list.map((x) => {
        const when = (() => { try { return new Date(x.at).toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }); } catch { return x.at; } })();
        return el("li", {}, `${when} · ${modelName(x.model)} · ${x.mode === "quick" ? "quick launch" : "planned"} · `,
          x.target === "cloud" ? (x.sessionId ? el("a", { href: `https://claude.ai/code/${x.sessionId}`, target: "_blank", rel: "noopener" }, "cloud session") : "cloud session") : "prompt copied");
      })));
  }

  // Overview -------------------------------------------------------------
  function overview() {
    const list = all();
    if (!list.length) return el("section", { class: "view" }, emptyState());
    const s = stats(list);
    const ideas = list.filter((t) => t.idea);
    const p1open = list.filter((t) => t.priority === "P1" && t.status !== "done");
    const next = list.filter((t) => t.status !== "done").sort(byRank).slice(0, 7);

    const statCards = el("div", { class: "stats" },
      el("div", { class: "panel stat" }, el("div", { class: "eyebrow" }, "Overall"),
        el("div", { class: "big num" }, `${s.pct}%`), el("div", { class: "small muted" }, `${s.done} of ${s.total} tasks done`), bar(s)),
      el("div", { class: "panel stat" }, el("div", { class: "eyebrow" }, "In progress"),
        el("div", { class: "big num" }, String(s.doing)), el("div", { class: "small muted" }, s.blocked ? `${s.blocked} blocked` : "nothing blocked")),
      el("div", { class: "panel stat" }, el("div", { class: "eyebrow" }, "Open P1 tasks"),
        el("div", { class: "big num" }, String(p1open.length)), el("div", { class: "small muted" }, "must-do items still open")),
      el("div", { class: "panel stat" }, el("div", { class: "eyebrow" }, "★ New ideas"),
        el("div", { class: "big num" }, String(ideas.length)), el("div", { class: "small muted" }, `${ideas.filter((t) => t.status === "done").length} built so far`)));

    const phasePanel = el("div", { class: "panel" }, el("h2", {}, "By phase"),
      PHASES.map((p) => { const ps = stats(list.filter((t) => t.phase === p));
        return el("div", { class: "phase-row" }, el("strong", {}, p), bar(ps), el("span", { class: "num small muted" }, `${ps.done}/${ps.total}`)); }),
      el("p", { class: "small muted" }, "Now = polish the core loop. Before launch = minimum content and systems. Launch = measure the first minute. After launch = updates every 1–2 weeks."));

    const nextPanel = el("div", { class: "panel" }, el("h2", {}, "Up next"),
      el("div", { class: "list" }, next.map((t) => taskRow(t, { hidePhase: false }))));

    const areaGrid = el("div", { class: "areas" }, areaNames(list).map((a) => {
      const as = stats(list.filter((t) => t.area === a));
      return el("button", { class: "area-card", onclick: () => { Object.assign(filters, { area: a, phase: "", signal: "", q: "", ideas: false }); savePrefs(); go("tasks"); } },
        el("div", { class: "row" }, el("span", {}, a), el("span", { class: "num muted" }, `${as.done}/${as.total}`)), bar(as));
    }));

    const sigPanel = el("div", { class: "panel" }, el("h2", {}, "Signal coverage"),
      SIGNALS.map((g) => { const gs = stats(list.filter((t) => (t.signals || []).includes(g.n)));
        return el("div", { class: "phase-row" }, el("span", {}, `${g.n} · ${g.short}`), bar(gs), el("span", { class: "num small muted" }, `${gs.done}/${gs.total}`)); }));

    return el("section", { class: "view" }, statCards,
      el("div", { class: "two" }, nextPanel, el("div", { class: "view" }, phasePanel, sigPanel)),
      el("div", { class: "panel" }, el("h2", {}, "Systems"), el("p", { class: "small muted" }, "Pick a system to see its tasks."), areaGrid));
  }
  function areaNames(list) {
    const seen = new Set(list.map((t) => t.area));
    return [...AREAS.filter((a) => seen.has(a)), ...[...seen].filter((a) => !AREAS.includes(a)).sort()];
  }

  // Tasks ----------------------------------------------------------------
  function tasksView() {
    const list = all();
    const areaOpts = areaNames(list);
    const set = (k) => (e) => { filters[k] = e.target.type === "checkbox" ? e.target.checked : e.target.value; savePrefs(); render(); };

    const search = el("input", { id: "f-q", type: "search", class: "field", placeholder: "Search tasks", "aria-label": "Search tasks" });
    search.value = filters.q;
    let t0; search.addEventListener("input", () => { clearTimeout(t0); t0 = setTimeout(() => { filters.q = search.value; savePrefs(); renderList(); }, 150); });

    const sel = (id, key, label, opts) => el("select", { id, class: "field", "aria-label": label, onchange: set(key) },
      opts.map(([v, txt]) => el("option", { value: v, selected: filters[key] === v }, txt)));

    const filterBar = el("div", { class: "panel" }, el("div", { class: "filters" },
      search,
      sel("f-area", "area", "System", [["", "All systems"], ...areaOpts.map((a) => [a, a])]),
      sel("f-phase", "phase", "Phase", [["", "All phases"], ...PHASES.map((p) => [p, p])]),
      sel("f-signal", "signal", "Signal", [["", "All signals"], ...SIGNALS.map((g) => [String(g.n), `${g.n} · ${g.short}`])]),
      sel("f-status", "status", "Status", [["open", "Not done"], ["", "Any status"], ...STATUSES.map((s) => [s, STATUS_LABEL[s]])]),
      sel("f-group", "group", "Group by", [["area", "Group by system"], ["phase", "Group by phase"]]),
      el("label", { class: "check" }, el("input", { id: "f-ideas", type: "checkbox", checked: filters.ideas, onchange: set("ideas") }), "★ New ideas only"),
      el("button", { class: "btn", onclick: () => { Object.assign(filters, { q: "", area: "", phase: "", signal: "", status: "open", ideas: false }); savePrefs(); render(); } }, "Clear")));

    const listHost = el("div", { class: "view", id: "list-host" });
    const wrap = el("section", { class: "view" }, filterBar, addPanel(areaOpts), listHost);
    renderList(listHost);
    return wrap;
  }
  function filtered() {
    const q = filters.q.trim().toLowerCase();
    return all().filter((t) =>
      (!filters.area || t.area === filters.area) &&
      (!filters.phase || t.phase === filters.phase) &&
      (!filters.signal || (t.signals || []).includes(Number(filters.signal))) &&
      (filters.status === "" ? true : filters.status === "open" ? t.status !== "done" : t.status === filters.status) &&
      (!filters.ideas || t.idea) &&
      (!q || `${t.title} ${t.detail} ${t.notes} ${t.area}`.toLowerCase().includes(q))).sort(byRank);
  }
  function renderList(host = $("#list-host")) {
    if (!host) return;
    if (!tasks.size) { host.replaceChildren(emptyState()); return; }
    const list = filtered();
    const key = filters.group === "phase" ? "phase" : "area";
    const order = key === "phase" ? PHASES : areaNames(all());
    const groups = order.map((g) => [g, list.filter((t) => t[key] === g)]).filter(([, l]) => l.length);
    host.replaceChildren(
      el("div", { class: "count" }, `${list.length} task${list.length === 1 ? "" : "s"} shown`),
      ...(groups.length ? groups.map(([g, l]) => el("div", { class: "list" },
        el("div", { class: "group-title" }, el("h3", {}, g), el("span", { class: "count num" }, `${stats(l).done}/${l.length}`)),
        l.map((t) => taskRow(t, key === "area" ? { hideArea: true } : { hidePhase: true }))))
        : [el("div", { class: "notice" }, "No tasks match these filters.")]));
  }
  function addPanel(areaOpts) {
    const details = el("details", { class: "panel", id: "add-panel", open: addOpen }, el("summary", { class: "eyebrow" }, "Add a task"));
    details.addEventListener("toggle", () => { addOpen = details.open; });
    if (!canWrite || !col) { details.append(el("p", { class: "small muted" }, "You can view tasks but not add them with your access.")); return details; }
    const title = el("input", { id: "add-title", class: "field", required: true, placeholder: "e.g. Candy monster set: 6 species" });
    const area = el("select", { id: "add-area", class: "field" }, [...new Set([...AREAS, ...areaOpts])].map((a) => el("option", { value: a, selected: a === (filters.area || "Core loop") }, a)));
    const phase = el("select", { id: "add-phase", class: "field" }, PHASES.map((p) => el("option", { value: p }, p)));
    const prio = el("select", { id: "add-prio", class: "field" }, PRIOS.map((p) => el("option", { value: p, selected: p === "P2" }, p)));
    const detail = el("textarea", { id: "add-detail", class: "field", placeholder: "Details (optional)" });
    const sigs = SIGNALS.map((g) => el("input", { type: "checkbox", id: `add-s${g.n}`, value: String(g.n) }));
    const idea = el("input", { type: "checkbox", id: "add-idea" });
    const msg = el("span", { class: "small muted", role: "status" });
    const form = el("form", { class: "add-grid" },
      el("label", { class: "wide" }, "Task", title),
      el("label", {}, "System", area), el("label", {}, "Phase", phase), el("label", {}, "Priority", prio),
      el("label", { class: "wide" }, "Details", detail),
      el("div", { class: "wide" }, el("div", { class: "eyebrow" }, "Discovery signals"),
        el("div", { class: "sig-picks" }, SIGNALS.map((g, i) => el("label", { for: `add-s${g.n}` }, sigs[i], `${g.n} ${g.short}`)),
          el("label", { for: "add-idea" }, idea, "★ New idea"))),
      el("div", { class: "wide row-actions" }, el("button", { class: "btn primary", type: "submit" }, "Add task"), msg));
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = title.value.trim(); if (!name) return;
      const doc = { title: name, area: area.value, phase: phase.value, priority: prio.value, status: "todo",
        detail: detail.value.trim(), signals: sigs.filter((c) => c.checked).map((c) => Number(c.value)),
        idea: idea.checked, notes: "", order: Date.now() };
      const ref = col.doc();
      tasks.set(ref.id, doc); title.value = ""; detail.value = ""; sigs.forEach((c) => (c.checked = false)); idea.checked = false;
      msg.textContent = `Added “${name}”.`;
      scheduleRender();
      queueWrite(ref.id, () => ref.set(doc));
    });
    details.append(form);
    return details;
  }

  // Content matrix ---------------------------------------------------------
  function contentView() {
    const list = all().filter((t) => t.zone && t.slot);
    if (!list.length) return el("section", { class: "view" }, emptyState());
    const find = (z, s) => list.find((t) => t.zone === z && t.slot === s);
    const zs = stats(list);
    const rows = ZONES.map((z) => {
      const zt = list.filter((t) => t.zone === z); const st = stats(zt);
      return el("tr", {},
        el("td", {}, el("div", { class: "zone-name" }, z), el("div", { class: "small muted num" }, `${st.done}/${st.total} ready · ${zt[0]?.phase || ""}`)),
        SLOTS.map((s) => { const t = find(z, s);
          if (!t) return el("td", { class: "muted small" }, "—");
          return el("td", {}, el("button", { class: "cell", disabled: !canWrite, title: t.detail || t.title,
            onclick: () => cycleStatus(t.id) },
            el("span", { class: `pill s-${t.status}` }, STATUS_LABEL[t.status]),
            el("span", { class: "name" }, t.title.replace(`${z}: `, "")))); }));
    });
    return el("section", { class: "view" },
      el("div", { class: "panel" }, el("h2", {}, "Zones, trees and monsters"),
        el("p", { class: "small muted" }, `${zs.done} of ${zs.total} content slots ready. Each zone needs a shakeable Common, Uncommon and Rare tree plus its own monster set. Click a cell to change its status. Launch with Forest, Candy and Sandy; ship Icy, Volcanic and Cosmic as updates.`),
        bar(zs)),
      el("div", { class: "panel table-wrap" }, el("table", {},
        el("thead", {}, el("tr", {}, el("th", {}, "Zone"), SLOTS.map((s) => el("th", {}, s === "Monsters" ? "Monster set" : `${s} tree`)))),
        el("tbody", {}, rows))));
  }

  // Signals ----------------------------------------------------------------
  function signalsView() {
    const list = all();
    return el("section", { class: "view" },
      el("div", { class: "notice" }, "From Roblox's official discovery docs, as explained in the video. Signals 1–4 are the most important group; 5–8 are important. Each signal counts only players who joined from Recommended For You on Home, and every number is an average per player."),
      el("div", { class: "sig-grid" }, SIGNALS.map((g) => {
        const gl = list.filter((t) => (t.signals || []).includes(g.n)).sort(byRank);
        const gs = stats(gl);
        return el("div", { class: "panel sig-card" },
          el("div", { class: "sig-head" }, el("div", { class: "sig-num" }, String(g.n)),
            el("div", {}, el("h3", {}, g.name), el("span", { class: `badge ${g.top ? "top" : "imp"}` }, g.top ? "Most important" : "Important"))),
          el("p", { class: "small", style: "margin:0" }, g.what),
          el("p", { class: "small muted", style: "margin:0" }, el("strong", {}, "In this game: "), g.game),
          bar(gs),
          el("ul", { class: "mini" }, gl.slice(0, 8).map((t) => el("li", {}, el("span", { class: `dot d-${t.status}`, "aria-label": STATUS_LABEL[t.status] }), t.title))),
          gl.length > 8 ? el("button", { class: "btn", onclick: () => { Object.assign(filters, { signal: String(g.n), area: "", phase: "", q: "", status: "", ideas: false }); savePrefs(); go("tasks"); } }, `See all ${gl.length} tasks`) : null);
      })));
  }

  // Numbers & rules -----------------------------------------------------------
  function numbersView() {
    return el("section", { class: "view" },
      el("div", { class: "notice" }, "Approved numbers as of place v75 (Nov 13). Change them in the game first, then here."),
      el("div", { class: "sig-grid" }, NUMBERS.map((g) => el("div", { class: "panel table-wrap" }, el("h3", {}, g.title),
        el("table", { style: "min-width:0" }, el("tbody", {}, g.rows.map(([k, v]) => el("tr", {}, el("td", {}, k), el("td", { class: "num" }, v)))))))),
      el("div", { class: "two" },
        el("div", { class: "panel" }, el("h2", {}, "How we work"), el("ul", { class: "rules" }, RULES_WORK.map((r) => el("li", {}, r)))),
        el("div", { class: "panel" }, el("h2", {}, "Algorithm rules"), el("ul", { class: "rules" }, RULES_ALGO.map((r) => el("li", {}, r))))));
  }

  const views = { overview, tasks: tasksView, content: contentView, signals: signalsView, numbers: numbersView };

  // ---------- Routing ----------
  function go(v) { if (location.hash !== `#${v}`) location.hash = v; else { view = v; render(); } }
  function readHash() { const h = location.hash.slice(1); view = views[h] ? h : "overview"; render(); window.scrollTo(0, 0); }
  window.addEventListener("hashchange", readHash);
  for (const b of document.querySelectorAll(".tab")) b.addEventListener("click", () => go(b.dataset.view));

  // ---------- Boot ----------
  readHash();
  // Launcher capabilities load alongside the tasks; until they answer, launches fall back to copying the prompt.
  (async () => {
    try {
      const claude = window.claude;
      if (!claude) return;
      const [s, m] = await Promise.all([claude.use("sample"), claude.use("mcp")]);
      sample = s; mcp = m;
      if (mcp) {
        const lt = await mcp.listTools(CCR).catch(() => null);
        canCloud = !!lt?.servers?.some((x) => x.server === CCR && x.tools.some((tool) => tool.name === "create_session"));
      }
    } catch { /* launcher falls back to copying the prompt */ }
    scheduleRender();
  })();
  const timer = setTimeout(() => { if (!loaded) setSync("Saved tasks can't be reached yet."); }, 10000);
  (async () => {
    try {
      const claude = window.claude;
      db = claude ? await claude.use("db") : null;
      const user = claude ? await claude.use("user") : null;
      if (user && typeof user.can === "function") { const w = await user.can("data.write"); if (w === false) canWrite = false; }
    } catch { db = null; }
    if (!db) { clearTimeout(timer); setSync("Offline view"); render(); return; }
    col = db.collection("tasks");
    col.onSnapshot((snap) => {
      tasks.clear();
      for (const d of snap.docs) tasks.set(d.id, d.data());
      if (!snap.metadata.fromCache) { loaded = true; clearTimeout(timer); }
      setSync(canWrite ? (snap.metadata.hasPendingWrites ? "Saving…" : "All changes saved") : "View only");
      scheduleRender();
    }, (err) => { clearTimeout(timer); loaded = true; setSync(err.code === "revoked" ? "Access changed" : "Saved tasks can't be reached."); scheduleRender(); });
  })();
})();
</script>
